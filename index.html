<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的網頁程式作品集 | Portfolio Pass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink-bg: #fff0f5;
            --pink-primary: #ff69b4;
            --pink-hover: #ff1493;
            --pink-glow: rgba(255, 105, 180, 0.4);
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #fff5f8 0%, #ffe4e9 50%, #fce4ec 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 背景流動氣泡/光暈動畫 */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.6;
            animation: float 10s infinite alternate ease-in-out;
        }

        .blob-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: #ffb6c1;
        }

        .blob-2 {
            bottom: -10%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: #ffdae9;
            animation-delay: -5s;
        }

        .blob-3 {
            top: 40%;
            left: 30%;
            width: 35vw;
            height: 35vw;
            background: #f8bbd0;
            animation-delay: -2s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* 已解鎖關卡卡片 Hover 動畫 */
        .unlocked-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 2px solid rgba(255, 182, 193, 0.6);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .unlocked-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.8),
                transparent
            );
            transform: rotate(45deg) translateY(-100%);
            transition: transform 0.6s ease;
        }

        .unlocked-card:hover::before {
            transform: rotate(45deg) translateY(100%);
        }

        .unlocked-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: #ff69b4;
            box-shadow: 0 15px 30px -5px rgba(255, 105, 180, 0.35),
                        0 0 15px rgba(255, 182, 193, 0.5);
        }

        /* 未解鎖關卡卡片 */
        .locked-card {
            background: rgba(240, 235, 240, 0.6);
            backdrop-filter: blur(8px);
            border: 2px dashed rgba(200, 180, 195, 0.5);
            cursor: not-allowed;
            transition: all 0.3s ease;
        }

        .locked-card:hover {
            background: rgba(235, 225, 235, 0.8);
            border-color: #d1b3c4;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        /* 大頭貼邊框脈衝光 Glow 效果 */
        .avatar-container {
            position: relative;
        }

        .avatar-container::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, #ff69b4, #ffb6c1, #ff1493);
            z-index: -1;
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.6; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.03); filter: blur(4px); }
        }

        /* 徽章亮光粉條 */
        .badge-pink {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
        }
    </style>
</head>
