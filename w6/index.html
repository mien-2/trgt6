<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>✨ 拍拍二選一投票器 ✨</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: 可愛圓體字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      background-color: #FFF5F7;
      background-image: radial-gradient(#FFD1DC 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: #5D4037;
    }

    /* 可愛立體按鈕特效 */
    .btn-cute {
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 0 rgba(93, 64, 55, 0.15);
    }
    .btn-cute:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(93, 64, 55, 0.15);
    }

    /* 漂浮動畫 */
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: float 3s ease-in-out infinite;
    }

    /* 載入轉圈圈 */
    .loader {
      border: 4px solid #FFE4E8;
      border-top: 4px solid #FF6B8B;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start py-6 px-4 select-none">

  <!-- 隱藏管理員彩蛋按鈕 (右上角小皇冠) -->
  <button id="adminEggBtn" onclick="triggerAdminReveal()" title="房主提前開票彩蛋"
    class="fixed top-3 right-3 z-40 w-10 h-10 rounded-full bg-white/70 hover:bg-amber-100 text-amber-400/60 hover:text-amber-500 flex items-center justify-center text-lg transition-all shadow-sm">
    👑
  </button>

  <!-- 頂部標題區 -->
  <header class="text-center mb-5 mt-2">
    <div class="inline-block bg-white px-4 py-1 rounded-full text-xs font-bold text-pink-500 shadow-sm mb-2 border border-pink-100">
      📸 選擇困難症救星
    </div>
    <h1 onclick="goHome()" class="cursor-pointer text-3xl font-black tracking-wide text-pink-600 drop-shadow-sm flex items-center justify-center gap-2">
      <span class="animate-float inline-block">🧸</span>
      拍拍二選一
      <span class="animate-float inline-block" style="animation-delay: 0.5s;">✨</span>
    </h1>
  </header>

  <!-- 主容器卡片 -->
  <main class="w-full max-w-md bg-white/95 backdrop-blur-sm rounded-[2rem] shadow-xl border-4 border-pink-200 p-5 relative overflow-hidden">
    
    <!-- 全域 Loading 遮罩 -->
    <div id="loadingOverlay" class="hidden absolute inset-0 bg-white/85 backdrop-blur-xs z-30 flex flex-col items-center justify-center rounded-[1.8rem]">
      <div class="loader mb-3"></div>
      <p id="loadingText" class="text-pink-600 font-bold text-base animate-pulse">魔法傳送中...</p>
    </div>

    <!-- ==================== 視圖 1：建立新投票 ==================== -->
    <section id="createView" class="space-y-5">
      <!-- 題目輸入 -->
      <div>
        <label class="block text-sm font-bold text-pink-600 mb-1.5">🎀 1. 今天要幫你決定什麼呢？</label>
        <input type="text" id="pollTitle" placeholder="例如：午餐吃拉麵還是咖哩飯？" maxlength="40"
          class="w-full px-4 py-3 rounded-2xl bg-pink-50/70 border-2 border-pink-200 focus:border-pink-400 focus:bg-white focus:outline-none text-base font-bold placeholder-pink-300 transition-colors" />
      </div>

      <!-- 雙照片拍攝區 (1:1 正方形) -->
      <div>
        <label class="block text-sm font-bold text-pink-600 mb-1.5">📷 2. 點擊方框拍照或選圖（自動裁成 1:1）</label>
        <div class="grid grid-cols-2 gap-3">
          <!-- 選項 A -->
          <div class="flex flex-col items-center">
            <label for="inputImgA" class="w-full aspect-square rounded-3xl border-3 border-dashed border-pink-300 bg-pink-50 hover:bg-pink-100/70 cursor-pointer flex flex-col items-center justify-center overflow-hidden relative group transition-all shadow-inner">
              <img id="previewA" class="hidden w-full h-full object-cover" alt="選項A預覽" />
              <div id="placeholderA" class="text-center p-2">
                <span class="text-3xl block mb-1 group-hover:scale-110 transition-transform">📸</span>
                <span class="text-xs font-bold text-pink-500">拍攝選手 A</span>
              </div>
              <span class="absolute top-2 left-2 bg-pink-500 text-white text-xs font-black px-2.5 py-0.5 rounded-full shadow">A</span>
            </label>
            <input type="file" id="inputImgA" accept="image/*" capture="environment" class="hidden" onchange="handleImageSelect(event, 'A')" />
          </div>

          <!-- 選項 B -->
          <div class="flex flex-col items-center">
            <label for="inputImgB" class="w-full aspect-square rounded-3xl border-3 border-dashed border-amber-300 bg-amber-50 hover:bg-amber-100/70 cursor-pointer flex flex-col items-center justify-center overflow-hidden relative group transition-all shadow-inner">
              <img id="previewB" class="hidden w-full h-full object-cover" alt="選項B預覽" />
              <div id="placeholderB" class="text-center p-2">
                <span class="text-3xl block mb-1 group-hover:scale-110 transition-transform">📸</span>
                <span class="text-xs font-bold text-amber-600">拍攝選手 B</span>
              </div>
              <span class="absolute top-2 left-2 bg-amber-400 text-white text-xs font-black px-2.5 py-0.5 rounded-full shadow">B</span>
            </label>
            <input type="file" id="inputImgB" accept="image/*" capture="environment" class="hidden" onchange="handleImageSelect(event, 'B')" />
          </div>
        </div>
      </div>

      <!-- 截止時間設定 -->
      <div>
        <label class="block text-sm font-bold text-pink-600 mb-1.5">⏰ 3. 什麼時候自動開票？</label>
        <input type="datetime-local" id="pollDeadline"
          class="w-full px-4 py-2.5 rounded-2xl bg-pink-50/70 border-2 border-pink-200 focus:border-pink-400 focus:bg-white focus:outline-none text-sm font-bold text-gray-700" />
      </div>

      <!-- 送出建立按鈕 -->
      <button onclick="createPoll()"
        class="btn-cute w-full py-3.5 rounded-2xl bg-gradient-to-r from-pink-400 to-rose-400 hover:from-pink-500 hover:to-rose-500 text-white font-black text-lg tracking-wider flex items-center justify-center gap-2">
        <span>🚀</span> 產生專屬投票連結！
      </button>

      <!-- CodePen 測試輔助區：直接輸入編號進入投票 -->
      <div class="pt-3 border-t-2 border-dashed border-pink-100">
        <p class="text-xs text-center text-gray-400 mb-2 font-bold">已有投票編號？直接輸入測試看看 👇</p>
        <div class="flex gap-2">
          <input type="text" id="quickPollIdInput" placeholder="輸入 P 開頭編號..."
            class="flex-1 px-3 py-2 rounded-xl bg-gray-50 border border-gray-200 text-xs font-bold focus:outline-none focus:border-pink-300" />
          <button onclick="loadPollByInput()" class="btn-cute px-4 py-2 rounded-xl bg-amber-300 text-amber-900 font-bold text-xs">
            前往投票
          </button>
        </div>
      </div>
    </section>

    <!-- ==================== 視圖 2：投票與開票頁面 ==================== -->
    <section id="voteView" class="hidden space-y-4">
      <!-- 頂部狀態列：倒數計時 / 開票狀態 -->
      <div id="statusBanner" class="bg-amber-100/80 border-2 border-amber-200 rounded-2xl px-4 py-2.5 flex items-center justify-between">
        <span id="statusBadge" class="text-xs font-black px-2.5 py-1 rounded-full bg-amber-400 text-white">⏳ 投票進行中</span>
        <span id="countdownText" class="text-sm font-black text-amber-800 tracking-wide">計算時間中...</span>
      </div>

      <!-- 投票題目 -->
      <h2 id="displayTitle" class="text-xl font-black text-center text-gray-800 px-2 leading-snug">
        載入題目中...
      </h2>

      <!-- 雙照片對決區 -->
      <div class="grid grid-cols-2 gap-3 pt-1">
        <!-- 選項 A 卡片 -->
        <div id="cardA" onclick="castVote('A')"
          class="cursor-pointer group relative rounded-3xl overflow-hidden border-4 border-pink-200 bg-pink-50 transition-all hover:border-pink-400 hover:shadow-md">
          <div class="aspect-square w-full overflow-hidden relative">
            <img id="displayImgA" src="" alt="選項A" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
            <span class="absolute top-2 left-2 bg-pink-500 text-white text-sm font-black w-7 h-7 rounded-full flex items-center justify-center shadow">A</span>
            <!-- 獲勝皇冠 -->
            <div id="crownA" class="hidden absolute top-2 right-2 bg-amber-400 text-white text-xs font-black px-2 py-1 rounded-full shadow animate-bounce">
              👑 獲勝
            </div>
          </div>
          <!-- 底部操作/結果區 -->
          <div class="p-2.5 text-center bg-white">
            <div id="voteBtnTextA" class="text-sm font-black text-pink-500 group-hover:text-pink-600">
              👆 投給 A
            </div>
            <!-- 開票進度條 -->
            <div id="resultBoxA" class="hidden space-y-1">
              <div class="flex justify-between text-xs font-black text-pink-600">
                <span id="percentA">0%</span>
                <span id="countA">0 票</span>
              </div>
              <div class="w-full h-2.5 bg-pink-100 rounded-full overflow-hidden">
                <div id="barA" class="h-full bg-pink-500 rounded-full transition-all duration-700" style="width: 0%"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- 選項 B 卡片 -->
        <div id="cardB" onclick="castVote('B')"
          class="cursor-pointer group relative rounded-3xl overflow-hidden border-4 border-amber-200 bg-amber-50 transition-all hover:border-amber-400 hover:shadow-md">
          <div class="aspect-square w-full overflow-hidden relative">
            <img id="displayImgB" src="" alt="選項B" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" />
            <span class="absolute top-2 left-2 bg-amber-400 text-white text-sm font-black w-7 h-7 rounded-full flex items-center justify-center shadow">B</span>
            <!-- 獲勝皇冠 -->
            <div id="crownB" class="hidden absolute top-2 right-2 bg-amber-400 text-white text-xs font-black px-2 py-1 rounded-full shadow animate-bounce">
              👑 獲勝
            </div>
          </div>
          <!-- 底部操作/結果區 -->
          <div class="p-2.5 text-center bg-white">
            <div id="voteBtnTextB" class="text-sm font-black text-amber-500 group-hover:text-amber-600">
              👆 投給 B
            </div>
            <!-- 開票進度條 -->
            <div id="resultBoxB" class="hidden space-y-1">
              <div class="flex justify-between text-xs font-black text-amber-600">
                <span id="percentB">0%</span>
                <span id="countB">0 票</span>
              </div>
              <div class="w-full h-2.5 bg-amber-100 rounded-full overflow-hidden">
                <div id="barB" class="h-full bg-amber-400 rounded-full transition-all duration-700" style="width: 0%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 已投票提示 -->
      <p id="votedHint" class="hidden text-center text-xs font-bold text-pink-500 bg-pink-50 py-2 rounded-xl">
        💖 你已經投過票囉！靜待開票結果揭曉吧～
      </p>

      <!-- 分享連結區塊 -->
      <div class="bg-pink-50/80 border-2 border-pink-100 rounded-2xl p-3 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-bold text-pink-600">🔗 專屬投票連結（編號：<span id="displayPollId"></span>）</span>
          <button onclick="fetchPollData(currentPollId, false)" class="text-xs font-bold text-gray-500 hover:text-pink-500">
            🔄 重新整理
          </button>
        </div>
        <div class="flex gap-2">
          <input type="text" id="shareUrlInput" readonly
            class="flex-1 px-3 py-1.5 rounded-xl bg-white border border-pink-200 text-xs text-gray-500 select-all focus:outline-none" />
          <button onclick="copyShareUrl()"
            class="btn-cute px-3.5 py-1.5 rounded-xl bg-pink-400 text-white font-bold text-xs whitespace-nowrap">
            複製連結
          </button>
        </div>
      </div>

      <!-- 返回建立新投票 -->
      <div class="text-center pt-1">
        <button onclick="goHome()" class="text-xs font-bold text-gray-400 hover:text-pink-500 underline">
          ＋ 我也要發起新的二選一投票
        </button>
      </div>
    </section>

  </main>

  <!-- 可愛提示 Toast -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-gray-800/90 text-white px-5 py-2.5 rounded-full text-sm font-bold shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50">
    提示訊息
  </div>

  <script>
    // ==========================================
    // 1. 系統設定與狀態變數
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyNRYvIstpCib2iPQibz4R2FLvkAevT2yxPELU65MqzHSBp-wVYpGG8rx71U7nJCsjp/exec";
    
    let base64ImgA = "";
    let base64ImgB = "";
    let currentPollId = "";
    let currentPollData = null;
    let countdownTimer = null;

    // ==========================================
    // 2. 初始化載入
    // ==========================================
    window.addEventListener("DOMContentLoaded", () => {
      // 預設截止時間設為「現在時間 + 30 分鐘」
      const defaultDeadline = new Date(Date.now() + 30 * 60000);
      const tzOffset = defaultDeadline.getTimezoneOffset() * 60000;
      const localISOTime = new Date(defaultDeadline - tzOffset).toISOString().slice(0, 16);
      document.getElementById("pollDeadline").value = localISOTime;

      // 檢查網址是否有 ?poll=P... 參數
      const urlParams = new URLSearchParams(window.location.search);
      const pollParam = urlParams.get("poll");
      if (pollParam) {
        enterVoteMode(pollParam);
      }
    });

    // ==========================================
    // 3. 圖片處理：Canvas 1:1 置中裁切 + 800px 壓縮
    // ==========================================
    function handleImageSelect(event, option) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement("canvas");
          const TARGET_SIZE = 800; // 目標輸出 800x800
          canvas.width = TARGET_SIZE;
          canvas.height = TARGET_SIZE;
          const ctx = canvas.getContext("2d");

          // 計算 1:1 置中裁切座標
          const minSide = Math.min(img.width, img.height);
          const sx = (img.width - minSide) / 2;
          const sy = (img.height - minSide) / 2;

          // 繪製並壓縮為 JPEG (品質 0.8)
          ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, TARGET_SIZE, TARGET_SIZE);
          const compressedDataUrl = canvas.toDataURL("image/jpeg", 0.8);

          if (option === "A") {
            base64ImgA = compressedDataUrl;
            document.getElementById("previewA").src = compressedDataUrl;
            document.getElementById("previewA").classList.remove("hidden");
            document.getElementById("placeholderA").classList.add("hidden");
          } else {
            base64ImgB = compressedDataUrl;
            document.getElementById("previewB").src = compressedDataUrl;
            document.getElementById("previewB").classList.remove("hidden");
            document.getElementById("placeholderB").classList.add("hidden");
          }
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // ==========================================
    // 4. 建立新投票 (POST action: "create")
    // ==========================================
    async function createPoll() {
      const title = document.getElementById("pollTitle").value.trim();
      const deadlineInput = document.getElementById("pollDeadline").value;

      if (!title) return showToast("🎀 請先輸入投票題目喔！");
      if (!base64ImgA || !base64ImgB) return showToast("📸 請拍滿 A 與 B 兩張照片！");
      if (!deadlineInput) return showToast("⏰ 請設定開票截止時間！");

      const pollId = "P" + Date.now().toString(36).toUpperCase();
      const deadlineISO = new Date(deadlineInput).toISOString();

      showLoading(true, "正在把照片傳送到雲端魔法屋...");

      try {
        // 使用 text/plain 避免 GAS CORS Preflight 問題
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "create",
            pollId: pollId,
            title: title,
            imgA: base64ImgA,
            imgB: base64ImgB,
            deadline: deadlineISO
          })
        });

        const data = await res.json();
        if (data.success) {
          showToast("🎉 投票建立成功！");
          // 嘗試更新網址列 (在 CodePen iframe 內可能會被限制，故用 try-catch 包覆)
          try {
            const newUrl = window.location.pathname + "?poll=" + pollId;
            window.history.pushState({ poll: pollId }, "", newUrl);
          } catch (err) {
            console.log("Sandbox 環境略過 pushState");
          }
          enterVoteMode(pollId);
        } else {
          showToast("❌ 建立失敗：" + (data.error || "未知錯誤"));
        }
      } catch (err) {
        console.error(err);
        showToast("❌ 網路連線失敗，請檢查 GAS 部署權限！");
      } finally {
        showLoading(false);
      }
    }

    // ==========================================
    // 5. 進入投票與開票頁面 (GET)
    // ==========================================
    function loadPollByInput() {
      const val = document.getElementById("quickPollIdInput").value.trim();
      if (!val) return showToast("請輸入投票編號！");
      enterVoteMode(val);
    }

    async function enterVoteMode(pollId) {
      currentPollId = pollId;
      document.getElementById("createView").classList.add("hidden");
      document.getElementById("voteView").classList.remove("hidden");
      document.getElementById("displayPollId").textContent = pollId;

      // 組合分享連結
      const baseUrl = window.location.href.split("?")[0];
      document.getElementById("shareUrlInput").value = `${baseUrl}?poll=${pollId}`;

      await fetchPollData(pollId, true);
    }

    async function fetchPollData(pollId, showSpinner = true) {
      if (showSpinner) showLoading(true, "正在讀取投票資訊...");

      try {
        const res = await fetch(`${GAS_API_URL}?poll=${encodeURIComponent(pollId)}`);
        const data = await res.json();

        if (data.error) {
          showToast("⚠️ " + data.error);
          goHome();
          return;
        }

        currentPollData = data;
        renderPollUI();
      } catch (err) {
        console.error(err);
        showToast("❌ 讀取投票失敗，請稍後再試！");
      } finally {
        if (showSpinner) showLoading(false);
      }
    }

    // ==========================================
    // 6. 渲染畫面狀態、倒數計時與開票結果
    // ==========================================
    function renderPollUI() {
      if (!currentPollData) return;

      document.getElementById("displayTitle").textContent = currentPollData.title;
      document.getElementById("displayImgA").src = currentPollData.imgA;
      document.getElementById("displayImgB").src = currentPollData.imgB;

      // 清除舊計時器
      if (countdownTimer) clearInterval(countdownTimer);

      const updateState = () => {
        const now = new Date();
        const deadline = currentPollData.deadline ? new Date(currentPollData.deadline) : null;
        const isExpired = deadline && (now >= deadline);
        const isRevealed = currentPollData.status === "revealed" || isExpired;

        if (isRevealed) {
          // === 已開票狀態 ===
          clearInterval(countdownTimer);
          showResultsUI();
        } else {
          // === 倒數計時中 ===
          const diff = deadline - now;
          const mins = Math.floor((diff / 1000 / 60) % 60);
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const secs = Math.floor((diff / 1000) % 60);

          let timeStr = "";
          if (days > 0) timeStr += `${days}天 `;
          if (hours > 0 || days > 0) timeStr += `${String(hours).padStart(2, '0')}:`;
          timeStr += `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

          document.getElementById("statusBanner").className = "bg-amber-100/80 border-2 border-amber-200 rounded-2xl px-4 py-2.5 flex items-center justify-between";
          document.getElementById("statusBadge").className = "text-xs font-black px-2.5 py-1 rounded-full bg-amber-400 text-white";
          document.getElementById("statusBadge").textContent = "⏳ 投票倒數中";
          document.getElementById("countdownText").textContent = timeStr;

          // 檢查本機是否已投過票
          const votedChoice = localStorage.getItem("voted_" + currentPollId);
          if (votedChoice) {
            document.getElementById("votedHint").classList.remove("hidden");
            document.getElementById("voteBtnTextA").textContent = votedChoice === "A" ? "✅ 你已投給 A" : "選項 A";
            document.getElementById("voteBtnTextB").textContent = votedChoice === "B" ? "✅ 你已投給 B" : "選項 B";
          } else {
            document.getElementById("votedHint").classList.add("hidden");
            document.getElementById("voteBtnTextA").textContent = "👆 投給 A";
            document.getElementById("voteBtnTextB").textContent = "👆 投給 B";
          }
        }
      };

      updateState();
      countdownTimer = setInterval(updateState, 1000);
    }

    function showResultsUI() {
      const vA = Number(currentPollData.votesA || 0);
      const vB = Number(currentPollData.votesB || 0);
      const total = vA + vB;
      const pctA = total === 0 ? 0 : Math.round((vA / total) * 100);
      const pctB = total === 0 ? 0 : Math.round((vB / total) * 100);

      // 頂部橫幅改為開票完成
      document.getElementById("statusBanner").className = "bg-pink-100 border-2 border-pink-300 rounded-2xl px-4 py-2.5 flex items-center justify-between";
      document.getElementById("statusBadge").className = "text-xs font-black px-2.5 py-1 rounded-full bg-pink-500 text-white";
      document.getElementById("statusBadge").textContent = "🎉 正式開票結果";
      document.getElementById("countdownText").textContent = `總票數：${total} 票`;

      // 隱藏投票按鈕文字，顯示進度條
      document.getElementById("voteBtnTextA").classList.add("hidden");
      document.getElementById("voteBtnTextB").classList.add("hidden");
      document.getElementById("resultBoxA").classList.remove("hidden");
      document.getElementById("resultBoxB").classList.remove("hidden");
      document.getElementById("votedHint").classList.add("hidden");

      document.getElementById("percentA").textContent = `${pctA}%`;
      document.getElementById("countA").textContent = `${vA} 票`;
      document.getElementById("barA").style.width = `${pctA}%`;

      document.getElementById("percentB").textContent = `${pctB}%`;
      document.getElementById("countB").textContent = `${vB} 票`;
      document.getElementById("barB").style.width = `${pctB}%`;

      // 顯示獲勝皇冠
      document.getElementById("crownA").classList.toggle("hidden", !(vA > vB && total > 0));
      document.getElementById("crownB").classList.toggle("hidden", !(vB > vA && total > 0));
    }

    // ==========================================
    // 7. 進行投票 (POST action: "vote")
    // ==========================================
    async function castVote(choice) {
      if (!currentPollData) return;

      // 檢查是否已開票或過期
      const now = new Date();
      const deadline = currentPollData.deadline ? new Date(currentPollData.deadline) : null;
      if (currentPollData.status === "revealed" || (deadline && now >= deadline)) {
        return showToast("⏰ 投票已經結束並開票囉！");
      }

      // 防止重複投票
      if (localStorage.getItem("voted_" + currentPollId)) {
        return showToast("💖 你已經投過票囉，每人限投一票！");
      }

      showLoading(true, `正在把愛心投給選手 ${choice}...`);

      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "vote",
            pollId: currentPollId,
            choice: choice
          })
        });

        const data = await res.json();
        if (data.success) {
          localStorage.setItem("voted_" + currentPollId, choice);
          showToast(`🎉 成功投給選手 ${choice}！`);
          await fetchPollData(currentPollId, false);
        } else {
          showToast("⚠️ " + (data.error || "投票失敗"));
          await fetchPollData(currentPollId, false);
        }
      } catch (err) {
        console.error(err);
        showToast("❌ 投票傳送失敗，請檢查網路！");
      } finally {
        showLoading(false);
      }
    }

    // ==========================================
    // 8. 隱藏管理員提前開票彩蛋 (POST action: "reveal")
    // ==========================================
    async function triggerAdminReveal() {
      if (!currentPollId || document.getElementById("voteView").classList.contains("hidden")) {
        return showToast("👑 這是房主彩蛋！進入投票頁面後點擊可提前開票～");
      }

      if (currentPollData && currentPollData.status === "revealed") {
        return showToast("🎉 目前已經是開票狀態囉！");
      }

      const confirmReveal = confirm("👑【房主隱藏彩蛋】\n確定要提前結束倒數，並立即公布開票結果嗎？");
      if (!confirmReveal) return;

      showLoading(true, "正在施展提前開票魔法...");

      try {
        const res = await fetch(GAS_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "reveal",
            pollId: currentPollId
          })
        });

        const data = await res.json();
        if (data.success) {
          showToast("🎊 已提前開票完成！");
          await fetchPollData(currentPollId, false);
        } else {
          showToast("❌ 開票失敗：" + (data.error || "未知錯誤"));
        }
      } catch (err) {
        console.error(err);
        showToast("❌ 連線失敗！");
      } finally {
        showLoading(false);
      }
    }

    // ==========================================
    // 9. 工具函式
    // ==========================================
    function goHome() {
      if (countdownTimer) clearInterval(countdownTimer);
      currentPollId = "";
      currentPollData = null;
      document.getElementById("voteView").classList.add("hidden");
      document.getElementById("createView").classList.remove("hidden");
      try {
        window.history.pushState({}, "", window.location.pathname);
      } catch (err) {}
    }

    function copyShareUrl() {
      const input = document.getElementById("shareUrlInput");
      input.select();
      input.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(input.value).then(() => {
        showToast("📋 專屬連結已複製！快貼給朋友吧～");
      }).catch(() => {
        document.execCommand("copy");
        showToast("📋 連結已複製！");
      });
    }

    function showLoading(show, text = "處理中...") {
      const overlay = document.getElementById("loadingOverlay");
      document.getElementById("loadingText").textContent = text;
      overlay.classList.toggle("hidden", !show);
    }

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.classList.remove("opacity-0");
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add("opacity-0");
      }, 2800);
    }
  </script>
</body>
